# Requires: Repo → Settings → Pages → Source: **GitHub Actions** (not "Deploy from a branch").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # og-default.jpg is committed in public/assets/ — regenerate locally: pnpm run generate:og
      - run: pnpm run build
        env:
          VITE_SITE_URL: https://boikovfinance.com
          VITE_APP_SITE_NAME: ארטיום בויקוב
          VITE_APP_TITLE: ארטיום בויקוב | יועץ משכנתאות בישראל
          VITE_APP_DESCRIPTION: יועץ משכנתאות מנוסה שעוזר לך להשיג את הריבית הנמוכה ביותר. ייעוץ ראשוני ללא תשלום וללא התחייבות. ליווי אישי מול כל הבנקים.
          VITE_OG_IMAGE: https://boikovfinance.com/assets/og-default.jpg
          VITE_OG_IMAGE_ALT: ארטיום בויקוב – יועץ משכנתאות, ייעוץ משכנתאות בישראל
          VITE_TWITTER_SITE: '@boikovfinance'
          VITE_TWITTER_CREATOR: '@boikovfinance'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
