<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%VITE_APP_LOGO_URL%" sizes="64x64" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="author" content="%VITE_APP_SITE_NAME%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="%VITE_APP_SITE_NAME%" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%VITE_OG_IMAGE_ALT%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="%VITE_TWITTER_SITE%" />
    <meta name="twitter:creator" content="%VITE_TWITTER_CREATOR%" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%VITE_OG_IMAGE_ALT%" />

    <script type="application/ld+json">%VITE_HOME_JSON_LD%</script>
  </head>

  <body>
    <div
      id="app-splash"
      aria-busy="true"
      aria-live="polite"
      style="position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#f0f7ff 0%,#ffffff 55%,#eef4fc 100%)"
    >
      <div class="app-splash__inner">
        <img
          class="app-splash__logo"
          src="/assets/logo.png"
          alt="בויקוב משכנתאות"
          width="132"
          height="132"
          decoding="async"
          fetchpriority="high"
        />
        <div class="app-splash__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="טוען">
          <div class="app-splash__bar-fill"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
